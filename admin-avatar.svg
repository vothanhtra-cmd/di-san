<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title description">
  <title id="title">Huy hiệu Admin Raglai</title>
  <desc id="description">Huy hiệu vàng đồng với dãy núi và biểu tượng chiến binh cách điệu.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset=".48" stop-color="#d4a743"/>
      <stop offset="1" stop-color="#80551f"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#324b45"/>
      <stop offset="1" stop-color="#172b2b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="77" fill="#231e16"/>
  <circle cx="80" cy="80" r="72" fill="url(#metal)"/>
  <circle cx="80" cy="80" r="64" fill="url(#night)" stroke="#fff0b0" stroke-width="2"/>
  <path d="M37 106 64 68l14 18 13-27 34 47v12H37z" fill="#607b61"/>
  <path d="m52 106 24-30 14 17 10-16 29 29v12H52z" fill="#a5ad79"/>
  <path d="m64 68 8 11-8-3-7 8 7-16zm27-9 10 16-10-4-7 7 7-19z" fill="#f3d9ac"/>
  <path d="M55 120c4-18 17-28 25-28s21 10 25 28" fill="#171c1b" stroke="url(#metal)" stroke-width="3"/>
  <path d="M57 92 62 68l18-12 18 12 5 24-13-9H70z" fill="#b87936" stroke="#f4d786" stroke-width="3"/>
  <path d="m68 68 12-11 12 11-12 8z" fill="#324b45" stroke="#f4d786" stroke-width="2"/>
  <path d="M75 48h10l-2 7h-6zM72 50l-5-7 11 3M88 50l5-7-11 3" fill="url(#metal)" stroke="#f4d786" stroke-width="2" stroke-linejoin="round"/>
  <path d="M68 83h7m10 0h7" stroke="#f8dfa0" stroke-width="3" stroke-linecap="round"/>
  <path d="M75 91q5 4 10 0" fill="none" stroke="#f8dfa0" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 105v18m-9-9h18" stroke="#d7ae53" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="80" cy="80" r="62" fill="none" stroke="#fff0b0" stroke-opacity=".65"/>
</svg>
